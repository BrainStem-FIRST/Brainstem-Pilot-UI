<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BrainSTEM Pilot</title>
    <script>
      // GitHub Pages has no server-side routing, so a deep link 404s.
      // Encode the intended path into a query string and bounce to index.html,
      // which decodes it back via history.replaceState (see index.html).
      var pathSegmentsToKeep = 1; // keep "/Brainstem-Pilot-UI"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
